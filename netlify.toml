# Millie's Content Dashboard — routes.
#
# Two data sources, both owned by this site: HubSpot for the client book,
# Slack for the request feed. Nothing else.

[[redirects]]
  from = "/api/accounts"
  to = "/.netlify/functions/accounts"
  status = 200

[[redirects]]
  from = "/api/content-requests"
  to = "/.netlify/functions/content-requests"
  status = 200

[[redirects]]
  from = "/api/content-request-write"
  to = "/.netlify/functions/content-request-write"
  status = 200

[[redirects]]
  from = "/api/lineage-analytics"
  to = "/.netlify/functions/lineage-analytics"
  status = 200
