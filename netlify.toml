# Millie's Content Dashboard — routes.
#
# The dashboard is the site root (index.html); /content is kept as an
# alias so existing links and muscle memory keep working.

[[redirects]]
  from = "/content"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/hubspot"
  to = "/.netlify/functions/hubspot"
  status = 200

[[redirects]]
  from = "/api/account-health"
  to = "/.netlify/functions/account-health"
  status = 200

[[redirects]]
  from = "/api/pr-products"
  to = "/.netlify/functions/pr-products"
  status = 200

[[redirects]]
  from = "/api/content-requests"
  to = "/.netlify/functions/content-requests"
  status = 200

[[redirects]]
  from = "/api/content-request-write"
  to = "/.netlify/functions/content-request-write"
  status = 200
